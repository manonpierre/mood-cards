<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mood Cards</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>Mood Cards</h1>
    <p>
        Explorez vos inspirations et vos envies pour créer un intérieur qui vous ressemble.
    </p>
</header>


<main>

    <div id="accueil">
        <button onclick="startGame()">
            Commencer l'exploration
        </button>
    </div>


    <div id="jeu" style="display:none;">

        <p id="compteur">
            Carte 1 / 20
        </p>

        <img id="imageCarte" src="" alt="Inspiration décoration">


        <div class="choix">
            <button onclick="choisir('aime')">
                ✓ J'aime
            </button>

            <button onclick="choisir('mitige')">
                ~ Mitigé
            </button>

            <button onclick="choisir('pas')">
                ✕ J'aime pas
            </button>
        </div>


        <h3>Pourquoi ?</h3>

        <p>
            Échange oral avec votre architecte
        </p>


    </div>

</main>


<script src="cartes.js"></script>
<script src="script.js"></script>

</body>
</html>
